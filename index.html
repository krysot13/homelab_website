    </div>

    <script>
        const toggle = document.getElementById('serviceToggle');
        const publicDiv = document.getElementById('public-services');
        const localDiv = document.getElementById('local-services');
        const descText = document.getElementById('desc-text');

        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                publicDiv.classList.remove('active');
                setTimeout(() => {
                    publicDiv.style.display = 'none';
                    localDiv.style.display = 'block';
                    setTimeout(() => localDiv.classList.add('active'), 50);
                }, 300);
                descText.textContent = 'Lokální adresy a správa zařízení v domácí síti.';
            } else {
                localDiv.classList.remove('active');
                setTimeout(() => {
                    localDiv.style.display = 'none';
                    publicDiv.style.display = 'block';
                    setTimeout(() => publicDiv.classList.add('active'), 50);
                }, 300);
                descText.textContent = 'Rychlý přehled veřejných služeb.';
            }
        });
    </script>
</body>
</html>
